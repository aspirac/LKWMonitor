INTERFACE_NOT_CALLED_FSE = Process type must be 10 or 20 FSE Interface will not be called
FSE_NOT_UPDATED = FSE will not be updated
FSE_INFO_ALREADY_EXISTS = FSE information already exists. FSE Interface will not be called
INTERFACE_NO_PARAMETERS = Licence place and driver name must be provided
